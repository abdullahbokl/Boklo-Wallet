name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Configure toolchain (web + linux desktop off)
        run: flutter config --no-enable-web --no-enable-linux-desktop || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json / injectable)
        run: dart run build_runner build --release

      - name: Verify formatting
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  functions:
    name: Functions typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
